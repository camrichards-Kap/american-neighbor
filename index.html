<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>American Neighbor | Local help from the military community in Goldsboro, NC (prototype)</title>
<meta name="description" content="Interactive prototype of a local services marketplace connecting Goldsboro, NC with service members, veterans and military families. All data is fictional.">
<meta name="robots" content="noindex">
<meta property="og:title" content="American Neighbor (prototype)">
<meta property="og:description" content="Your task. Their mission. A prototype marketplace for local help from the military community around Goldsboro, NC.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0a2341">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>:root{--navy:#0a2341;--navy2:#143a66;--slate:#475569;--ink:#1b2430;--muted:#5b6573;--line:#e3e6ec;--bg:#f6f7f9;--card:#fff;--gold:#c8a14b;--gold-d:#7f6118;--gold-s:#f7efdc;--navy-s:#e8edf4;--ok:#1d6b45;--ok-s:#e7f3ec;--warn:#8a5a00;--warn-s:#fdf3dc;--bad:#b3261e;--bad-s:#fbeae8;--info:#1d4f91;--info-s:#e6eefb;--r:14px;--sh:0 1px 2px rgba(10,35,65,.06),0 8px 24px rgba(10,35,65,.07);--head:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--body:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.55 var(--body);color:var(--ink);background:var(--bg)}
h1,h2,h3,h4{font-family:var(--head);color:var(--navy);line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,3.4vw,2.3rem);font-weight:800}h2{font-size:1.3rem;font-weight:700}h3{font-size:1.05rem;font-weight:700}h4{font-size:.95rem}
p{margin:0 0 .8em}a{color:var(--navy2)}img{max-width:100%;display:block}small{font-size:.82rem}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
.skip{position:absolute;left:-999px;top:0;background:var(--navy);color:#fff;padding:10px 16px;z-index:200}.skip:focus{left:8px;top:8px}
.ic{flex:none;vertical-align:-3px}.ic.gold{color:var(--gold);fill:var(--gold)}
.muted{color:var(--muted)}.small{font-size:.86rem}.center{text-align:center}.pad{padding:22px}.mt{margin-top:26px}.warn-t{color:var(--warn)}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 56px}.wrap.narrow{max-width:820px}
.page-title{margin-bottom:18px}.lead{font-size:1.1rem;color:var(--muted);max-width:60ch}
.eyebrow{display:inline-flex;gap:6px;align-items:center;font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-d);margin-bottom:10px}
.ribbon{background:var(--navy);color:#dbe4f0;font-size:.8rem;text-align:center;padding:6px 14px}
/* header */
.top{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.top.role-contractor{border-bottom:3px solid var(--gold)}.top.role-admin{border-bottom:3px solid var(--navy)}
.top-in{max-width:1220px;margin:0 auto;padding:0 20px;height:68px;display:flex;align-items:center;gap:18px}
.logo-img{height:40px;width:auto;max-width:170px;object-fit:contain}
.role-pill{font-size:.75rem;font-weight:700;background:var(--navy);color:#fff;border-radius:999px;padding:4px 10px;white-space:nowrap}
.nav{display:flex;gap:4px;margin-left:auto;align-items:center}
.nav a{position:relative;text-decoration:none;color:var(--ink);font-weight:600;font-size:.93rem;padding:9px 12px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.nav a:hover{background:var(--navy-s)}.nav a.on{background:var(--navy);color:#fff}
.count{display:inline-flex;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--gold);color:var(--navy);font-size:.72rem;font-weight:800;align-items:center;justify-content:center}.count.plain{background:var(--navy-s);color:var(--navy)}
.top-right{display:flex;align-items:center;gap:6px}
.icon-btn{position:relative;border:0;background:transparent;border-radius:999px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;color:var(--navy);text-decoration:none}.icon-btn:hover{background:var(--navy-s)}
.dot{position:absolute;top:2px;right:0;min-width:18px;height:18px;border-radius:999px;background:var(--bad);color:#fff;font-size:.68rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.bell-wrap{position:relative}.pop{position:absolute;right:0;top:48px;width:340px;max-width:calc(100vw - 24px);background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 18px 50px rgba(10,35,65,.22);max-height:70vh;overflow:auto;z-index:60}
.pop-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.note{display:block;padding:11px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:.9rem}.note:hover{background:var(--bg)}.note.new{background:#fffaf0;border-left:3px solid var(--gold)}.note small{display:block;color:var(--muted)}
.me{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.9rem;padding:4px 8px 4px 4px;border-radius:999px}.me:hover{background:var(--navy-s)}
.avatar{border-radius:50%;object-fit:cover;background:var(--navy-s);flex:none}.avatar.lg{border:4px solid #fff;box-shadow:var(--sh)}
.admin-av{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;background:var(--navy);color:var(--gold)}
.burger{display:none}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--navy);background:var(--navy);color:#fff;font-weight:700;border-radius:999px;padding:11px 20px;text-decoration:none;line-height:1.2;transition:transform .12s,box-shadow .12s,background .12s;min-height:44px}
.btn:hover{background:var(--navy2);box-shadow:0 6px 16px rgba(10,35,65,.18)}.btn:active{transform:translateY(1px)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}.btn.gold:hover{background:#d4b062}
.btn.ghost{background:#fff;color:var(--navy);border-color:#c9d1dc}.btn.ghost:hover{background:var(--navy-s)}
.btn.danger{background:var(--bad);border-color:var(--bad)}.btn.danger-t{color:var(--bad)}
.btn.sm{padding:7px 14px;font-size:.88rem;min-height:36px}.btn.full{width:100%}.btn.big{padding:15px 22px;font-size:1.05rem;margin-top:14px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.link{border:0;background:none;padding:0;color:var(--navy2);text-decoration:underline;font-weight:600;font-size:.9rem;text-align:left}
.link-arrow{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--navy);text-decoration:none}.link-arrow:hover{text-decoration:underline}
.backlink{display:inline-flex;gap:6px;align-items:center;color:var(--muted);text-decoration:none;font-weight:600;font-size:.9rem;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}.row.end{justify-content:flex-end;margin-top:16px}.row.between{justify-content:space-between;align-items:center}.row.center-row{justify-content:center}.row .field{flex:1 1 150px;margin-bottom:0}
/* cards and chips */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:18px}
.chip{display:inline-flex;align-items:center;font-size:.76rem;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.chip.ok{background:var(--ok-s);color:var(--ok)}.chip.warn{background:var(--warn-s);color:var(--warn)}.chip.bad{background:var(--bad-s);color:var(--bad)}.chip.info{background:var(--info-s);color:var(--info)}.chip.muted{background:#eceff3;color:var(--muted)}
.demo-tag{display:inline-block;font:700 .66rem/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--gold-d);border:1px dashed var(--gold);border-radius:6px;padding:3px 6px;vertical-align:middle;white-space:nowrap}
.notice{display:flex;gap:8px;align-items:flex-start;background:var(--info-s);color:#173b6c;border-radius:10px;padding:10px 12px;font-size:.9rem;margin:12px 0}.notice .ic{margin-top:2px}.notice.bad{background:var(--bad-s);color:#7d1a14}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}.empty .ic{color:var(--gold-d);margin-bottom:8px}.empty h3{margin-bottom:4px}
/* forms */
.field{display:block;margin-bottom:14px}.lbl{display:block;font-weight:600;font-size:.88rem;margin-bottom:5px;color:var(--navy)}.hint{display:block;font-size:.82rem;color:var(--muted);margin-top:4px}
input[type=text],input[type=search],input[type=number],input[type=date],input:not([type]),select,textarea{width:100%;border:1.5px solid #c9d1dc;border-radius:10px;padding:10px 12px;background:#fff;min-height:44px}
textarea{resize:vertical;min-height:80px}input:focus,select:focus,textarea:focus{border-color:var(--navy);outline:3px solid rgba(200,161,75,.45);outline-offset:0}
fieldset{border:0;padding:0;margin:0 0 14px}legend{font-weight:600;font-size:.88rem;color:var(--navy);margin-bottom:6px;padding:0}
.check,.toggle{display:flex;gap:9px;align-items:flex-start;font-size:.92rem;margin:8px 0;cursor:pointer}.check input,.toggle input{width:18px;height:18px;margin-top:2px;accent-color:var(--navy);flex:none}
/* layout */
.two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}.two-even{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:start}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.grid2>.card,.grid3>.card,.grid4>.card{margin:0}.sticky{position:sticky;top:86px}
/* hero */
.hero{background:linear-gradient(180deg,#fff 0,#f6f7f9 100%);border-bottom:1px solid var(--line)}
.hero-in{max-width:1180px;margin:0 auto;padding:48px 20px 56px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:48px;align-items:center}
.hero h1{font-size:clamp(2.2rem,5vw,3.5rem);letter-spacing:-.03em;margin-bottom:14px}
.searchbar{display:flex;gap:8px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:8px;box-shadow:0 14px 34px rgba(10,35,65,.12);margin:22px 0 16px}
.searchbar label{flex:1;display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--muted);min-width:0}.searchbar label:first-of-type{flex:1.5}.searchbar label+label{border-left:1px solid var(--line)}
.searchbar input,.searchbar select{border:0;padding:10px 0;min-height:44px;background:transparent;min-width:0}.searchbar input:focus,.searchbar select:focus{outline:0}.searchbar label:focus-within{outline:3px solid rgba(200,161,75,.5);border-radius:10px}
.hero-cta{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hero-media{position:relative}.hero-img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:26px;box-shadow:0 24px 60px rgba(10,35,65,.2)}
.hero-card{position:absolute;left:-28px;bottom:26px;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 12px 34px rgba(10,35,65,.22);max-width:310px}.hero-card small{color:var(--muted);display:block;margin-top:8px}
/* badges */
.badges{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0;padding:0}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;border-radius:999px;padding:4px 10px 4px 8px;background:var(--navy-s);color:var(--navy)}
.badge.b-background{background:var(--ok-s);color:var(--ok)}.badge.b-family{background:#f6e9f1;color:#7a2f5a}.badge.b-identity{background:var(--info-s);color:var(--info)}.badge.b-service{background:var(--gold-s);color:#6e5410}
.badge.off{background:#eef0f3;color:#7a828d}.badge.pend{background:var(--warn-s);color:var(--warn)}
.badges.mini .badge{padding:5px;border-radius:50%}
/* sections */
.sec{padding:8px 0}.sec.alt{background:#fff;border-block:1px solid var(--line)}.sec .wrap{padding-top:44px;padding-bottom:44px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}.sec-head.center{justify-content:center;text-align:center}.sec-head h2{font-size:clamp(1.4rem,2.6vw,1.9rem);font-weight:800;margin-bottom:4px}.sec-head p{margin:0}
.scroller{display:flex;gap:16px;overflow-x:auto;padding:4px 4px 16px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.cat-card{position:relative;flex:0 0 230px;height:200px;border-radius:var(--r);overflow:hidden;scroll-snap-align:start;text-decoration:none;color:#fff;box-shadow:var(--sh);transition:transform .18s}
.cat-card:hover{transform:translateY(-4px)}.cover{width:100%;height:100%;object-fit:cover}
.cat-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,35,65,0) 35%,rgba(10,35,65,.86) 100%)}
.cat-name,.cat-n{position:absolute;left:14px;right:12px;z-index:1}.cat-name{bottom:30px;font:700 1rem var(--head);display:flex;gap:6px;align-items:center}.cat-n{bottom:10px;font-size:.8rem;opacity:.9}
.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}.steps li{text-align:center}.steps p{color:var(--muted);margin:0}
.step-ic{display:inline-flex;width:54px;height:54px;border-radius:50%;background:var(--navy);color:var(--gold);align-items:center;justify-content:center;margin-bottom:12px}
.steps.vert{grid-template-columns:1fr;gap:16px;margin:22px 0}.steps.vert li{display:flex;gap:14px;text-align:left}.steps.vert .step-ic{width:44px;height:44px;flex:none;margin:0}.steps.vert h3{margin-bottom:2px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:20px 0 10px}.stats div{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:16px}.stats strong{display:block;font:800 2rem var(--head);color:var(--navy)}.stats span{color:var(--muted);font-size:.9rem}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s}.reveal.in{opacity:1;transform:none}
.mission-img{border-radius:26px;overflow:hidden;aspect-ratio:4/3;box-shadow:var(--sh)}.mission p{font-size:1.05rem}
.tcard p{margin-top:10px}.quote blockquote{margin:0 0 12px;font-size:1.02rem}.quote figcaption{color:var(--muted);font-size:.9rem}figure{margin:0}
.cta-band{background:var(--navy);color:#fff;text-align:center}.cta-band h2{color:#fff;font-size:clamp(1.4rem,3vw,2rem)}.cta-band p{color:#c9d4e3}
/* map */
.mapcard{padding:10px;overflow:hidden}.map{width:100%;height:auto;display:block;border-radius:10px}
.map-town{font:500 10px var(--body);fill:#5b6573}.map-city{font:800 13px var(--head);fill:var(--navy)}.map-note{font:600 10px var(--body);fill:var(--gold-d)}
.pin{cursor:pointer}.pin circle{fill:var(--navy);stroke:#fff;stroke-width:2;transition:r .15s}.pin text{font:700 8.500px var(--body);fill:#fff;text-anchor:middle;pointer-events:none}.pin:hover circle,.pin.sel circle,.pin:focus circle{fill:var(--gold)}.pin:hover text,.pin.sel text,.pin:focus text{fill:var(--navy)}.pin:focus{outline:none}
.map-cap{margin:8px 4px 2px}.map-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
/* contractor card */
.pro-card{display:flex;flex-direction:column;padding:18px;text-decoration:none;color:var(--ink);transition:transform .16s,box-shadow .16s,border-color .16s;margin:0}.pro-card:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 14px 34px rgba(10,35,65,.14)}
.pc-top{display:flex;gap:12px;align-items:center}.pc-id h3{margin:0;font-size:1.05rem}.pc-aff{margin:0;font-size:.82rem;color:var(--gold-d);font-weight:700}.pc-rate{margin:2px 0 0;font-size:.86rem;color:var(--muted)}
.pc-head{margin:12px 0 6px;font-weight:600}.pc-meta{font-size:.86rem;color:var(--muted);display:flex;gap:5px;align-items:center}
.pc-foot{margin-top:auto;padding-top:12px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);font-size:.93rem}.pro-card .badges{margin-bottom:12px}.pc-cta{color:var(--navy);font-weight:700;display:inline-flex;gap:4px;align-items:center}
.stars{display:inline-flex;gap:1px;vertical-align:-2px}.stars svg{fill:#d5dae2}.stars svg.on{fill:var(--gold)}
/* browse */
.chips-row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px}.pill{flex:none;display:inline-flex;gap:6px;align-items:center;border:1.5px solid #c9d1dc;background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:.88rem;color:var(--ink);min-height:40px}.pill:hover{border-color:var(--navy)}.pill.on{background:var(--navy);border-color:var(--navy);color:#fff}
.browse{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start}
.filters{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;position:sticky;top:86px}.filt-toggle{display:none}
.res-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}.res-head p{margin:0}
.seg{display:inline-flex;background:#e9edf2;border-radius:999px;padding:3px}.seg button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-weight:600;font-size:.86rem;display:inline-flex;gap:6px;align-items:center;color:var(--ink);min-height:36px}.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);color:var(--navy)}.seg.wide{margin-bottom:16px;flex-wrap:wrap}
/* profile */
.prof-head{display:flex;gap:20px;align-items:center}.name-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.name-row h1{margin:0}.headline{font-weight:600;font-size:1.05rem;margin:4px 0}
.kv{margin:0}.kv>div{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.kv>div:last-child{border:0}.kv dt{color:var(--muted);font-size:.9rem;display:flex;gap:6px;align-items:flex-start}.kv dd{margin:0;overflow-wrap:anywhere}
.ticks{list-style:none;padding:0;margin:10px 0}.ticks li{display:flex;gap:8px;align-items:flex-start;padding:4px 0}.ticks .ic{color:var(--ok);margin-top:3px}.ticks li.todo{color:var(--muted)}.ticks li.todo .ic{color:#b6bcc6}.ticks.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 16px}
.svc{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.svc:last-child{border:0}.svc small{display:block;color:var(--muted)}.svc-r{display:flex;gap:10px;align-items:center;flex:none}.price{font-weight:800;color:var(--navy);white-space:nowrap}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:8px}.gal{position:relative;border:0;padding:0;background:var(--navy-s);border-radius:12px;overflow:hidden;aspect-ratio:4/3;display:block}.gal.add{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;border:2px dashed #b9c2cf;color:var(--muted);cursor:pointer;font-size:.85rem;font-weight:600}
.from{font-size:1.05rem;margin-bottom:10px}.from strong{font:800 1.6rem var(--head);color:var(--navy)}.acts{display:flex;flex-direction:column;gap:10px}.acts .btn{width:100%}
.vlist{list-style:none;padding:0;margin:0}.vlist li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.vlist li:last-child{border:0}.vlist strong{display:block}.vlist small{display:block;color:var(--muted);margin-top:3px}

const VERIF_TYPES = {
  identity: { label: 'Identity', icon: 'id', means: 'A government photo ID was matched to this person by an identity verification provider.', not: 'It does not confirm military service or check criminal history.' },
  service: { label: 'Military service', icon: 'shield', means: 'Current or prior service in the U.S. Armed Forces was confirmed by a verification provider or a document review.', not: 'It does not confirm skills, licenses or character of service.' },
  family: { label: 'Military family affiliation', icon: 'heart', means: 'A spouse or dependent relationship to a service member or veteran was confirmed.', not: 'It does not mean this person served.' },
  background: { label: 'Background check', icon: 'doc', means: 'A background check by a consumer reporting agency was completed and reviewed.', not: 'It reflects one point in time and does not prove military history.' },
};
const VERIF_STATUS = { none: ['Not started', 'muted'], submitted: ['Submitted, awaiting review', 'warn'], processing: ['Processing', 'warn'], verified: ['Verified', 'ok'], needs_review: ['Needs review', 'warn'], rejected: ['Not approved', 'bad'] };
function verifItems(p) { return [['identity', 'identity'], ['affiliation', p.aff.kind === 'family' ? 'family' : 'service'], ['background', 'background']].map(([key, type]) => ({ key, type, ...VERIF_TYPES[type], status: p.v[key].status, at: p.v[key].at, method: p.v[key].method })); }
const verifLabel = it => it.type === 'background' && it.status === 'verified' ? 'Completed' : VERIF_STATUS[it.status][0];
function badgesHtml(p, variant) {
  return '<ul class="badges ' + (variant || '') + '">' + verifItems(p).map(it => {
    const ok = it.status === 'verified';
    if (variant === 'mini' && !ok) return '';
    return '<li class="badge ' + (ok ? 'ok' : it.status === 'none' ? 'off' : 'pend') + ' b-' + it.type + '" title="' + esc(it.label + ': ' + verifLabel(it) + ' (demo data)') + '">' + ic(it.icon, variant === 'mini' ? 14 : 16) + (variant === 'mini' ? '<span class="sr">' + esc(it.label + ' ' + verifLabel(it)) + '</span>' : '<span>' + esc(it.label) + (ok ? (it.type === 'background' ? ' completed' : ' verified') : ': ' + verifLabel(it).toLowerCase()) + '</span>') + '</li>';
  }).join('') + '</ul>';
}
function setVerif(pid, key, status, method) {
  const p = pro(pid); p.v[key] = { status, at: nowIso(), method: method || p.v[key].method };
  const it = verifItems(p).find(i => i.key === key);

  if (['submitted', 'processing'].includes(status)) notify('admin', p.name + ' submitted ' + it.label.toLowerCase() + ' for review.', '#/admin/verifications');

}

/* ---------- money ---------- */
const quote = (subtotal, catId) => quoteWith(S.settings, subtotal, catOf(catId).taxable);
function txNet(t) { // what actually moved after any refund
  if (t.status === 'refunded') return { gmv: 0, platform: 0, payout: 0, customer: 0 };
  if (t.status === 'partial_refund') return { gmv: t.kept, platform: t.keptPlatform, payout: r2(t.kept - t.keptPlatform), customer: t.kept };
  return { gmv: t.subtotal, platform: t.platform, payout: t.payout, customer: t.total };
}

/* ---------- availability ---------- */
const ACTIVE = ['requested', 'accepted', 'awaiting_payment', 'confirmed', 'in_progress'];
function slotsFor(p, date, ignoreId) {
  const d = parseYmd(date); if (date < dayOff(0) || !p.avail.days.includes(d.getDay()) || (p.avail.blocked || []).includes(date) || p.state !== 'active') return [];
  const taken = S.bookings.filter(b => b.contractorId === p.id && b.date === date && ACTIVE.includes(b.status) && b.id !== ignoreId).map(b => b.time);
  const out = []; const sh = +p.avail.start.split(':')[0], eh = +p.avail.end.split(':')[0], nowH = new Date().getHours();
  for (let h = sh; h < eh; h++) { const t = pad(h) + ':00'; if (taken.includes(t)) continue; if (date === dayOff(0) && h <= nowH + 1) continue; out.push(t); }
  return out;
}
const nextOpenDay = p => { for (let i = 0; i < 30; i++) if (slotsFor(p, dayOff(i)).length) return dayOff(i); return null; };

function setStatus(b, status, note) { b.status = status; b.timeline.push({ status, at: nowIso(), by: role(), note: note || '' }); }
const bLink = b => '#/booking/' + b.id;
function createBooking(d) {
  const p = pro(d.contractorId), s = p.services.find(x => x.id === d.serviceId);
  const price = s.type === 'hour' ? r2(s.price * d.hours) : s.price;
  const b = { id: 'b' + (1000 + S.bookings.length + 1) + Math.random().toString(36).slice(2, 4), customerId: d.customerId, contractorId: p.id, serviceId: s.id, serviceName: s.name, cat: s.cat, priceType: s.type, rate: s.price, hours: s.type === 'hour' ? d.hours : null,
    date: d.date, time: d.time, town: d.town, address: d.address, notes: d.notes, photos: d.photos || [], materials: d.materials || 'unsure', files: [], price, status: 'requested', createdAt: nowIso(), timeline: [{ status: 'requested', at: nowIso(), by: 'customer' }] };
  S.bookings.push(b);
  notify('contractor:' + p.id, cust(d.customerId).name + ' requested ' + s.name + ' on ' + fmtDate(d.date) + '.', bLink(b));
  save(); return b;
}
function acceptBooking(b) { setStatus(b, 'accepted'); notify('customer:' + b.customerId, pro(b.contractorId).name + ' accepted your request. A final quote is on the way.', bLink(b)); save(); }
function sendQuote(b, price, q) { b.price = r2(price); if (q) b.quote = q; setStatus(b, 'awaiting_payment', 'Final quote ' + money(b.price)); notify('customer:' + b.customerId, pro(b.contractorId).name + ' sent a final quote of ' + money(b.price) + '. Pay to confirm your booking.', '#/checkout/' + b.id); threadNote(b, pro(b.contractorId).name + ' sent an itemized quote of ' + money(b.price) + '.'); save(); }
function declineBooking(b, reason) { setStatus(b, 'declined', reason); notify('customer:' + b.customerId, pro(b.contractorId).name + ' could not take your request' + (reason ? ': ' + reason : '.'), bLink(b)); save(); }
function payBooking(b, method, sign) {
  const q = quote(b.price, b.cat);
  S.transactions.push({ id: 't' + b.id.slice(1), bookingId: b.id, customerId: b.customerId, contractorId: b.contractorId, at: nowIso(), ...q, method, status: 'held', refund: 0, paidOutAt: null });
  setStatus(b, 'confirmed'); recordAgreement(b, sign); notify('contractor:' + b.contractorId, cust(b.customerId).name + ' accepted your quote and paid. ' + b.serviceName + ' is confirmed for ' + fmtDate(b.date) + '.', bLink(b)); save();
}
function startJob(b) { setStatus(b, 'in_progress'); notify('customer:' + b.customerId, pro(b.contractorId).name + ' started your job.', bLink(b)); save(); }
function completeJob(b) {
  setStatus(b, 'completed'); const t = txOf(b.id); if (t && t.status === 'held') { t.status = 'paid_out'; t.paidOutAt = nowIso(); }
  notify('customer:' + b.customerId, 'Your job with ' + pro(b.contractorId).name + ' is complete. Leave a review.', bLink(b));
  notify('contractor:' + b.contractorId, 'Payout of ' + money(t ? t.payout : 0) + ' released for ' + b.serviceName + ' (demo).', '#/dash/earnings'); save();
}
const hoursUntil = b => (new Date(b.date + 'T' + b.time + ':00').getTime() - Date.now()) / 36e5;
function cancelPreview(b, by) { // what a cancellation would refund, before anyone commits to it
  const t = txOf(b.id); if (!t || t.status !== 'held') return { paid: false, refund: 0, kept: 0 };
  if (by === 'contractor' || by === 'admin' || hoursUntil(b) >= 24) return { paid: true, refund: t.total, kept: 0, full: true };
  const kept = r2(t.subtotal * 0.5); return { paid: true, refund: r2(t.total - kept), kept, full: false };
}
function cancelBooking(b, by, reason) {
  const pv = cancelPreview(b, by), t = txOf(b.id);
  if (pv.paid) { t.refund = pv.refund; if (pv.full) t.status = 'refunded'; else { t.status = 'partial_refund'; t.kept = pv.kept; t.keptPlatform = r2(pv.kept * S.settings.commissionPct / 100); t.paidOutAt = nowIso(); } }
  setStatus(b, 'cancelled', (by === 'customer' ? 'Cancelled by customer' : by === 'contractor' ? 'Cancelled by provider' : 'Cancelled by admin') + (reason ? ': ' + reason : '') + (pv.paid ? '. Refund ' + money(pv.refund) : ''));
  const other = by === 'customer' ? 'contractor:' + b.contractorId : 'customer:' + b.customerId;
  notify(other, 'Booking for ' + b.serviceName + ' on ' + fmtDate(b.date) + ' was cancelled.' + (pv.paid && by !== 'customer' ? ' Refund of ' + money(pv.refund) + ' issued (demo).' : ''), bLink(b)); save(); return pv;
}
const canCancel = (b, r) => r === 'customer' ? ['requested', 'accepted', 'awaiting_payment', 'confirmed'].includes(b.status) : r === 'contractor' ? ['accepted', 'awaiting_payment', 'confirmed'].includes(b.status) : ACTIVE.includes(b.status);

function convFor(customerId, contractorId, create) {

  if (!c && create) { c = { id: uid('v'), customerId, contractorId, messages: [], read: { customer: nowIso(), contractor: nowIso() } }; S.conversations.push(c); }

}

const lastAt = c => c.messages.length ? c.messages[c.messages.length - 1].at : '0';
const unreadIn = (c, side) => c.messages.filter(m => m.from !== side && m.from !== 'system' && m.at > (c.read[side] || '')).length;
const unreadTotal = () => role() === 'admin' ? 0 : myConvs().reduce((a, c) => a + unreadIn(c, role()), 0);
function sendMessage(c, from, text, auto) {

}

/* ---------- search ---------- */
function searchPros(f) {
  const tokens = (f.q || '').toLowerCase().split(/\s+/).filter(t => t.length > 1);
  let list = S.contractors.filter(p => p.state === 'active').map(p => {
    const svcs = p.services.filter(s => catOf(s.cat).active && (!f.cat || s.cat === f.cat));
    const hay = (p.name + ' ' + p.headline + ' ' + p.bio + ' ' + p.aff.status + ' ' + p.aff.branch + ' ' + svcs.map(s => s.name + ' ' + catOf(s.cat).name).join(' ')).toLowerCase();
    const svcHay = svcs.map(s => s.name + ' ' + catOf(s.cat).name).join(' ').toLowerCase() + ' ' + p.headline.toLowerCase();
    const rt = ratingOf(p.id), v = verifItems(p);
    const score = tokens.reduce((a, t) => a + (svcHay.includes(t) ? 3 : 0) + (hay.includes(t) ? 1 : 0), 0) + v.filter(i => i.status === 'verified').length * 0.5 + rt.avg * 0.3;
    return { p, svcs, hay, rt, v, score, price: svcs.length ? Math.min(...svcs.map(s => s.price)) : 0 };
  }).filter(x => x.svcs.length && tokens.every(t => x.hay.includes(t)));
  if (f.town) { const t = townOf(f.town); list = list.filter(x => milesBetween(t, x.p) <= x.p.radius); }
  if (f.maxPrice) list = list.filter(x => x.price <= +f.maxPrice);
  if (f.minRating) list = list.filter(x => x.rt.avg >= +f.minRating);
  if (f.when) { const days = f.when === 'today' ? [0] : f.when === '3days' ? [0, 1, 2] : [0, 1, 2, 3, 4, 5, 6]; list = list.filter(x => days.some(d => (f.when !== 'weekend' || [0, 6].includes(parseYmd(dayOff(d)).getDay())) && slotsFor(x.p, dayOff(d)).length)); }
  ['identity', 'affiliation', 'background'].forEach(k => { if (f['v_' + k]) list = list.filter(x => x.p.v[k].status === 'verified'); });
  const sort = f.sort || 'relevance';
  list.sort((a, b) => sort === 'rating' ? b.rt.avg - a.rt.avg || b.rt.count - a.rt.count : sort === 'price' ? a.price - b.price : sort === 'price_desc' ? b.price - a.price : b.score - a.score);
  return list;
}

/* ---------- CSV ---------- */
function downloadCsv(name, rows) {
  const csv = rows.map(r => r.map(c => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  if (FRAMED || window.__noDownload) { modal(name, '<p class="muted">This viewer cannot save files. Copy the statement and paste it into a spreadsheet. The downloadable version of the prototype saves a CSV file directly.</p><textarea id="csv-out" rows="10" readonly>' + esc(csv) + '</textarea><div class="row end"><button class="btn ghost" data-act="closeModal">Close</button><button class="btn" data-act="copyCsv">Copy to clipboard</button></div>', true); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function fileToDataUrl(file, max, cb) {
  if (!file || !/^image\//.test(file.type)) return cb(null);
  const rd = new FileReader(); rd.onload = () => { const im = new Image(); im.onload = () => { const sc = Math.min(1, max / Math.max(im.width, im.height)); const cv = document.createElement('canvas'); cv.width = Math.round(im.width * sc); cv.height = Math.round(im.height * sc); cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); cb(cv.toDataURL('image/jpeg', 0.72)); }; im.onerror = () => cb(null); im.src = rd.result; }; rd.onerror = () => cb(null); rd.readAsDataURL(file);
}

/* ===== features.js: jobs map, sign-up steps, reviews from other sites, itemized quotes, job agreements, job files ===== */
'use strict';

const MATERIALS_BY = { unsure: 'Not sure yet', customer: 'I already have them', provider: 'The provider should bring them', none: 'No materials needed' };
const MATERIALS_SHOWN = { customer: 'Customer supplies them', provider: 'Provider brings them', none: 'None needed' };
const MAP_JOB_ST = ['requested', 'accepted', 'awaiting_payment', 'confirmed', 'in_progress'];
const ROAD_FACTOR = 1.3, AVG_MPH = 38, TRAVEL_RATE = 0.7, FREE_TRIP_MILES = 10;
const hashN = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; };
const byWhen = (a, b) => (a.date + a.time).localeCompare(b.date + b.time);
const fmtFull = iso => new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
/* A job is drawn in its town, nudged a little so pins do not stack. It is never the street address. */
function jobPoint(b) { const t = townOf(b.town), h = hashN(b.id); return { lat: t.lat + ((h % 97) / 97 - 0.5) * 0.03, lng: t.lng + (((h >>> 8) % 89) / 89 - 0.5) * 0.04 }; }
const roadMiles = (a, b) => Math.max(1, Math.round(milesBetween(a, b) * ROAD_FACTOR));
const driveMins = mi => Math.round(mi / AVG_MPH * 60 + 4);
const jobTrip = (p, b) => { const mi = roadMiles(p, jobPoint(b)); return { mi, mins: driveMins(mi) }; };
const tripLabel = t => 'About ' + plural(t.mi, 'mile') + ', ' + t.mins + ' min each way';

const laborLine = b => ({ kind: 'labor', label: b.priceType === 'hour' ? b.serviceName + ': ' + b.hours + ' hr at ' + money0(b.rate) + '/hr' : b.serviceName + ' (flat rate)', amount: b.priceType === 'hour' ? r2(b.rate * b.hours) : b.rate });
const scopeFor = (b, mats) => b.serviceName + (b.hours ? ', about ' + plural(b.hours, 'hour') : '') + '.' + (b.notes ? ' As described by the customer: "' + b.notes + '"' : '') + (custHasMaterials(b) ? ' Customer supplies any materials.' : mats ? ' Materials listed in the quote are included.' : '');
function suggestQuote(b) {
  const p = pro(b.contractorId), lines = [laborLine(b)], has = custHasMaterials(b);
  let mats = [];
  if (!has) { mats = MATERIAL_HINTS.filter(h => h[0].test(b.notes || '')).slice(0, 3).map(h => ({ kind: 'materials', label: h[1], amount: h[2] })); if (!mats.length && CAT_SUPPLIES[b.cat]) mats = [{ kind: 'materials', label: CAT_SUPPLIES[b.cat][0], amount: CAT_SUPPLIES[b.cat][1] }]; }

  const rt = jobTrip(p, b).mi * 2;

}
function jobSummary(b) {

  const li = (k, v) => '<li><span>' + k + '</span><div>' + v + '</div></li>';
  return '<ul class="jobsum">' + li('Job', esc(b.serviceName) + (b.hours ? ', about ' + plural(b.hours, 'hour') : '') + ' at ' + (b.priceType === 'hour' ? money0(b.rate) + ' an hour' : money0(b.rate) + ' flat')) +
    li('When', fmtDate(b.date, { weekday: 'long', month: 'short', day: 'numeric' }) + ' at ' + fmtTime(b.time)) + li('Where', esc(townOf(b.town).name) + '. ' + tripLabel(t) + '.' + (out ? ' <span class="warn-t">Outside your ' + p.radius + '-mile travel radius.</span>' : '')) +
    li(esc(firstName(c.name)) + ' wrote', b.notes ? '"' + esc(b.notes) + '"' : '<span class="muted">No description.</span>') + li('Photos', b.photos.length ? plural(b.photos.length, 'photo') + ' attached to the request' : 'None attached') +

function qbTotal() { return r2(ui.qb.lines.reduce((a, l) => a + (+l.amount || 0), 0)); }

    { id: 'no-badge', cat: 'checks', q: 'Why is a badge missing from a profile?', a: 'A missing badge means that check has not been completed for that provider.',
      body: '<p>The profile\'s Verification panel shows each check as not started, in progress, needs review or completed, with the date. You can filter search results to show only providers who have completed the checks you care about.</p>', rel: ['what-badges-mean'], links: [['#/browse', 'Search with check filters']] },

    { id: 'when-paid', cat: 'pay', q: 'When does the provider get paid?', a: 'Your payment is held and released to the provider when the job is marked complete.',

function admVerifs() {

function admIssues() {

A.resolveIssue = d => { const r = S.reports.find(x => x.id === d.id), b = r.bookingId && booking(r.bookingId), t = b && txOf(b.id), max = t ? r2(txNet(t).customer - (t.adjust || 0)) : 0; modal('Resolve ' + ISSUE_TYPES[r.type].toLowerCase(), '<form data-form="resolveIssue"><input type="hidden" name="id" value="' + r.id + '"><blockquote>' + esc(r.text) + '</blockquote>' + field('Outcome', '<select name="outcome"><option>No action needed</option><option>Warning sent to provider</option><option>Warning sent to customer</option><option>Goodwill refund issued</option><option>Provider suspended pending review</option></select>') + (max > 0 ? field('Goodwill refund amount (optional)', '<input type="number" name="refund" min="0" max="' + max + '" step="0.01" value="0">', 'Up to ' + money(max) + '. Funded by the platform in this demo, so the provider payout is unchanged.') : '') + field('Note for the record', '<textarea name="note" rows="3" required minlength="5" maxlength="400"></textarea>') + '<div class="row end"><button type="button" class="btn ghost" data-act="closeModal">Back</button><button class="btn">Mark resolved</button></div></form>'); };
F.resolveIssue = o => { const r = S.reports.find(x => x.id === o.id), b = r.bookingId && booking(r.bookingId), t = b && txOf(b.id); let amt = Math.max(0, +o.refund || 0); if (t) amt = Math.min(amt, r2(txNet(t).customer - (t.adjust || 0))); else amt = 0;
  if (amt > 0) { t.adjust = r2((t.adjust || 0) + amt); notify('customer:' + b.customerId, 'A refund of ' + money(amt) + ' was issued for ' + b.serviceName + ' (demo).', bLink(b)); }
  if (/suspended/.test(o.outcome)) { pro(r.contractorId).state = 'suspended'; notify('contractor:' + r.contractorId, 'Your account was suspended pending review.', '#/dash'); }

function admContractors() {

A.suspend = d => { const p = pro(d.id), n = S.bookings.filter(b => b.contractorId === p.id && ACTIVE.includes(b.status)).length; modal('Suspend ' + p.name + '?', '<form data-form="suspend"><input type="hidden" name="id" value="' + p.id + '"><p>Their profile is hidden from search and they cannot accept new requests. ' + (n ? 'They have ' + plural(n, 'active booking') + ', which stay in place unless you cancel them from the bookings tab.' : '') + '</p>' + field('Reason (for the admin log)', '<input name="reason" required minlength="4" maxlength="140">') + '<div class="row end"><button type="button" class="btn ghost" data-act="closeModal">Back</button><button class="btn danger">Suspend account</button></div></form>'); };
F.suspend = o => { const p = pro(o.id); p.state = 'suspended'; notify('contractor:' + p.id, 'Your account was suspended by the admin team.', '#/dash'); logAdmin('Suspended ' + p.name + ': ' + o.reason.trim()); save(); A.closeModal(); toast(p.name + ' suspended.'); render(); };

tings in force when each payment was made.</p></div>';

A.csvTx = () => { const rows = [['DEMONSTRATION ONLY - American Neighbor prototype transactions'], ['Date', 'Booking', 'Customer', 'Provider', 'Job price', 'Customer fee', 'Tax', 'Customer paid', 'Commission', 'Payout', 'Platform revenue', 'Refunded', 'Status']]; S.transactions.forEach(t => { const n = txNet(t); rows.push([t.at.slice(0, 10), t.bookingId.toUpperCase(), cust(t.customerId).name, pro(t.contractorId).name, t.subtotal, t.customerFee, t.tax, t.total, t.commission, n.payout, r2(n.platform - (t.adjust || 0)), r2(t.refund + (t.adjust || 0)), t.status]); }); downloadCsv('american-neighbor-demo-transactions.csv', rows); toast('Transactions exported.'); };
